name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A9C72E: ${{ secrets.A9C72E }}
          B7CF40: ${{ secrets.B7CF40 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A9C72E', '')
          tag_b = os.environ.get('B7CF40', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- ae14b16469fc2a2eaf45b9e978d27ab433 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 9dd6d0a9be07288a44c3 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
